<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足跡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>footprint</h1>
        <p>footprint</p>
    </header>

    <main id="hint-container">
        <section class="puzzle" aria-labelledby="puzzle-title">
            <div class="puzzle__header">
                <div>
                    <p class="eyebrow">謎解きチャレンジ</p>
                    <h2 id="puzzle-title">隠された言葉を見つけよう</h2>
                    <p class="puzzle__lead">画像に隠されたヒントを読み解き、正しい単語を入力してください。回答は暗号化された検証方式で処理されるため、開発者ツールから直接は読み取れません。</p>
                </div>
                <figure class="puzzle__image">
                    <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=800&q=80" alt="夜空に浮かぶ月と雲の写真" loading="lazy">
                    <figcaption>空に浮かぶ光が示すのは…？</figcaption>
                </figure>
            </div>

            <form id="answer-form" class="answer-form" novalidate>
                <label for="answer-input">答え</label>
                <div class="answer-form__controls">
                    <input id="answer-input" name="answer" type="text" inputmode="text" autocomplete="off" placeholder="例）STAR" aria-describedby="answer-helper" required>
                    <button type="submit">送信</button>
                </div>
                <p id="answer-helper" class="helper-text">半角英字で入力し、前後の空白は無視されます。</p>
                <p id="answer-feedback" class="feedback" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Hint Site Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
